spring.application.name=api-gateway
server.port=9090

# Eureka Client Configuration
# Tells this microservice where to find the Eureka Server discovery registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enables fetching registry information from Eureka server (set to false only for Eureka Server itself)
eureka.client.fetch-registry=true

# Enables registering this instance with the Eureka server
eureka.client.register-with-eureka=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

#routing
spring.cloud.gateway.server.webflux.routes[0].id=department-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://DEPARTMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/departs/**

spring.cloud.gateway.server.webflux.routes[1].id=student-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/students/**

