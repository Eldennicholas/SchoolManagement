
# Application Name (This is how it will show up in the Eureka Dashboard)
spring.application.name=department-service

# The port your department-service will run on
server.port=8081

# Eureka Client Configuration
# Tells this microservice where to find the Eureka Server discovery registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enables fetching registry information from Eureka server (set to false only for Eureka Server itself)
eureka.client.fetch-registry=true

# Enables registering this instance with the Eureka server
eureka.client.register-with-eureka=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/department_db
spring.datasource.username=root
spring.datasource.password=Elden@2003

# Spring Jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



